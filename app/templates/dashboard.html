{% extends "base.html" %}
{% block content %}
<div id="dashboard-content" class="hidden">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-[#1A365D]">Casino-Card Kalender-Ansicht</h1>
        <button id="open-modal-btn" class="bg-[#2B6CB0] text-white px-4 py-2 rounded text-sm font-medium hover:bg-[#1A365D] transition shadow hidden">
            + Neuer Termin
        </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="bg-white p-5 border rounded shadow-sm flex flex-col">
            <h2 class="text-lg font-bold text-[#1A365D] mb-4 border-b pb-2">KI-Analyse (Ollama)</h2>
            <p class="text-sm text-gray-600 mb-4">Prüft die sichtbaren Kalenderdaten auf Überschneidungen und schlägt freie Zeiten vor.</p>
            <button id="run-ai-btn" class="w-full bg-emerald-600 text-white py-2 rounded text-sm hover:bg-emerald-700 transition mb-4">Konflikte analysieren</button>
            <div id="ai-result-box" class="flex-1 bg-gray-50 border rounded p-3 text-sm text-gray-700 overflow-y-auto whitespace-pre-wrap hidden"></div>
        </div>
        <div class="lg:col-span-3 bg-white p-4 border rounded shadow-sm min-h-[600px]">
            <div id="calendar-container"></div>
        </div>
    </div>
</div>

<!-- Modal: Neuer Termin (inkl. Skills) -->
<div id="event-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
        <h2 class="text-xl font-bold text-[#1A365D] mb-4">Neuen Termin anlegen</h2>
        <form id="event-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Titel</label>
                <input type="text" id="event-title" required class="mt-1 block w-full border-gray-300 rounded p-2 border focus:ring-[#2B6CB0]">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Zuweisen an (Trainer)</label>
                <select id="event-assignee" class="mt-1 block w-full border-gray-300 rounded p-2 border focus:ring-[#2B6CB0]">
                    <option value="">-- Unzugewiesen --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Benötigte Qualifikationen</label>
                <div id="skills-container" class="space-y-1 text-sm border p-2 rounded max-h-24 overflow-y-auto bg-gray-50">
                    <!-- Checkboxes injiziert via JS -->
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Start</label>
                    <input type="datetime-local" id="event-start" required class="mt-1 block w-full border-gray-300 rounded p-2 border focus:ring-[#2B6CB0]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ende</label>
                    <input type="datetime-local" id="event-end" required class="mt-1 block w-full border-gray-300 rounded p-2 border focus:ring-[#2B6CB0]">
                </div>
            </div>
            <div id="event-error" class="text-red-600 text-sm hidden"></div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" id="close-modal-btn" class="px-4 py-2 text-gray-600 hover:text-gray-900">Abbrechen</button>
                <button type="submit" class="bg-[#1A365D] text-white px-4 py-2 rounded hover:bg-[#2B6CB0]">Speichern</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Termin Details, RSVP & Reallocation -->
<div id="event-details-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
        <h2 id="detail-title" class="text-xl font-bold text-[#1A365D] mb-2"></h2>
        <p id="detail-time" class="text-sm text-gray-600 mb-4"></p>
        
        <div id="rsvp-section" class="hidden border-t pt-4 mt-4">
            <h3 class="text-sm font-bold text-gray-800 mb-2">Deine Rückmeldung:</h3>
            <div class="flex space-x-3 mb-3">
                <button id="btn-accept" class="flex-1 bg-emerald-600 text-white py-2 rounded text-sm hover:bg-emerald-700 transition">Bestätigen</button>
                <button id="btn-decline" class="flex-1 bg-red-600 text-white py-2 rounded text-sm hover:bg-red-700 transition">Ablehnen</button>
            </div>
            <div id="decline-container" class="hidden space-y-2">
                <label class="block text-xs font-medium text-gray-700">Begründung (Pflichtfeld):</label>
                <textarea id="decline-reason" class="w-full border-gray-300 rounded p-2 border text-sm" rows="2"></textarea>
                <button id="btn-submit-decline" class="w-full bg-red-800 text-white py-2 rounded text-sm hover:bg-red-900 transition">Absenden</button>
            </div>
            <div id="rsvp-error" class="text-red-600 text-xs hidden mt-2"></div>
        </div>

        <div id="reassign-section" class="hidden border-t pt-4 mt-4">
            <h3 class="text-sm font-bold text-red-600 mb-2">Termin abgelehnt! Neu zuweisen:</h3>
            <select id="reassign-select" class="block w-full border-gray-300 rounded p-2 border text-sm mb-3">
                <option value="">-- Wähle neuen Trainer --</option>
            </select>
            <button id="btn-reassign" class="w-full bg-[#1A365D] text-white py-2 rounded text-sm hover:bg-[#2B6CB0] transition">Speichern & Zuweisen</button>
        </div>

        <div class="flex justify-end mt-6">
            <button type="button" id="close-details-btn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Schließen</button>
        </div>
    </div>
</div>
{% endblock %}
