services:
  web:
    build: .
    container_name: bellmann_web
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg://bellmann_user:bellmann_pass@bellmann_db:5432/bellmann_db
      - JWT_SECRET_KEY=produktions-geheimnis-hier-aendern-2026
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    expose:
      - "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    volumes:
      - ./prompts:/app/prompts

  db:
    image: postgres:16-alpine
    container_name: bellmann_db
    restart: always
    environment:
      - POSTGRES_USER=bellmann_user
      - POSTGRES_PASSWORD=bellmann_pass
      - POSTGRES_DB=bellmann_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: bellmann_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
