# =============================================================================
# docker-compose.yml – Produktions-Stack des Kalenders der Bellmann Eng.
# -----------------------------------------------------------------------------
# SERVER (diese Datei allein):
#   Browser ──https://intern.bellmann-engineering.com/kalender──> Traefik
#       ──forwardAuth──> Authelia (Firmen-Login, schützt den ganzen Host)
#       └──:5000──> web (Gunicorn/Flask) ──:5432──> db (PostgreSQL)
#   Traefik (Netzwerk "traefik_network", Zertifikate) und Authelia laufen in einem
#   eigenen Stack auf dem Server. Host und Pfad: APP_HOST / APP_URL_PREFIX (.env),
#   Standard intern.bellmann-engineering.com + /kalender. Authelia setzt nach dem Login den Header
#   "Remote-Email"; damit meldet die App den passenden Mitarbeiter ohne zweite
#   Passwortabfrage an (AUTHELIA_SSO, siehe app/routes/calendar_routes.py::login).
#
# LOKAL (zusätzlich docker-compose.override.yml, Vorlage:
#   docker-compose.override.example.yml – setup.sh kopiert sie):
#   Browser ──https:8443──> nginx ──:5000──> web ──:5432──> db
#   Ohne Traefik/Authelia; "traefik_network" wird zu einem normalen lokalen Netzwerk,
#   AUTHELIA_SSO ist aus, angemeldet wird mit E-Mail + Passwort.
#
# web und db veröffentlichen KEINE Ports am Host ("expose" statt "ports").
# Zugangsdaten stehen NICHT hier, sondern in der .env-Datei (siehe .env.example).
# Compose ersetzt ${VARIABLE} beim Start durch die Werte aus der .env.
# =============================================================================
services:
  web:
    build: .
    image: bellmann-calendar:local
    container_name: bellmann_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Diese Werte ÜBERSCHREIBEN die .env – Produktion ist damit erzwungen,
      # egal ob in der .env z. B. FLASK_DEBUG=1 steht.
      APP_ENV: production
      FLASK_DEBUG: "0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Auf dem Server steht Authelia davor -> Header "Remote-Email" ist vertrauenswürdig.
      # Lokal setzt docker-compose.override.yml das auf "0".
      AUTHELIA_SSO: ${AUTHELIA_SSO:-1}
      # Pfad der App auf dem Host (app/utils/url_prefix.py) und daraus die öffentliche
      # Adresse für Links in E-Mails und den Google-OAuth-Callback.
      # Lokal überschreibt docker-compose.override.yml beides.
      APP_URL_PREFIX: ${APP_URL_PREFIX:-/kalender}
      APP_BASE_URL: https://${APP_HOST:-intern.bellmann-engineering.com}${APP_URL_PREFIX:-/kalender}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    # Der HEALTHCHECK selbst steht im Dockerfile (GET /health inkl. DB-Prüfung).
    # "default" für die Datenbank, "traefik_network" damit Traefik den Container erreicht.
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      # Bei mehreren Netzwerken muss Traefik explizit wissen, über welches es routen soll.
      - "traefik.docker.network=traefik_network"

      # Router: Pfad /kalender auf dem von Authelia geschützten Host.
      # KEIN StripPrefix nötig: Die App entfernt den Präfix selbst (APP_URL_PREFIX) und
      # erzeugt alle Links, Redirects und Cookie-Pfade mit ihm. So sieht Authelia den
      # vollen Pfad und die access_control-Regel für intern.bellmann-engineering.com greift.
      - "traefik.http.routers.bellmann_calendar.rule=Host(`${APP_HOST:-intern.bellmann-engineering.com}`) && PathPrefix(`${APP_URL_PREFIX:-/kalender}`)"
      - "traefik.http.routers.bellmann_calendar.entrypoints=websecure"
      - "traefik.http.routers.bellmann_calendar.tls.certresolver=myresolver"
      # Reihenfolge: zuerst Authelia (Login), dann Komprimierung.
      - "traefik.http.routers.bellmann_calendar.middlewares=authelia-bellmann-calendar@docker,bellmann_calendar-compress@docker"

      # Authelia-Middleware: Ohne Authelia-Login kommt niemand bis zur App. Die
      # Antwort-Header (u. a. Remote-Email) ÜBERSCHREIBEN gleichnamige Header des
      # Browsers – gefälschte Werte erreichen die App also nicht.
      # Wichtig: In Authelias access_control darf für diesen Pfad KEINE "bypass"-Regel stehen.
      - "traefik.http.middlewares.authelia-bellmann-calendar.forwardAuth.address=http://authelia:9091/api/verify?rd=https://${APP_HOST:-intern.bellmann-engineering.com}/authelia"
      - "traefik.http.middlewares.authelia-bellmann-calendar.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-bellmann-calendar.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"

      # gzip/brotli für CSS, JS, JSON (übernimmt lokal nginx).
      - "traefik.http.middlewares.bellmann_calendar-compress.compress=true"

      # Service: Gunicorn lauscht im Container auf Port 5000.
      - "traefik.http.services.bellmann_calendar.loadbalancer.server.port=5000"

  db:
    image: postgres:16-alpine
    container_name: bellmann_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Nur im projekteigenen Netzwerk erreichbar – NICHT im Traefik-Netzwerk, NICHT am Host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  # Muss auf dem Server bereits durch den Traefik-Stack existieren.
  # Lokal (docker-compose.override.yml) wird daraus ein normales, lokales Netzwerk.
  traefik_network:
    external: true

volumes:
  postgres_data:
