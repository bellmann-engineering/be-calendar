# =============================================================================
# nginx.conf – Reverse Proxy mit HTTPS vor der Flask-App (NUR lokal)
# -----------------------------------------------------------------------------
# Auf dem Server übernimmt Traefik (+ Authelia) diese Rolle, siehe docker-compose.yml.
# nginx kommt nur über docker-compose.override.yml (lokal) dazu.
#
# Eingehängt als TEMPLATE (/etc/nginx/templates/default.conf.template): Beim Start
# ersetzt das offizielle Nginx-Image ${NGINX_HTTPS_PORT} durch den Wert aus
# docker-compose.yml und schreibt das Ergebnis nach /etc/nginx/conf.d/default.conf.
# (Nur Variablen, die als Umgebungsvariable existieren, werden ersetzt – Nginx-eigene
# Variablen wie $host bleiben unangetastet.)
#
# Aufgaben:
#   1. Port 80  (Host 8080): leitet ALLES dauerhaft auf HTTPS um.
#   2. Port 443 (Host 8443): TLS-Terminierung, danach Weiterleitung an Gunicorn
#      (Service "web", Port 5000) über das interne Docker-Netzwerk.
#   3. Die Authelia-Header (Remote-*) entfernen: Lokal gibt es kein Authelia, ein
#      Browser dürfte sich damit nicht selbst als beliebiger Mitarbeiter ausgeben.
#      (Die Sicherheits-Header wie CSP/HSTS setzt die App selbst, app/utils/security_headers.py.)
#   4. Brute-Force-Schutz für Login/Passwort-Endpunkte (limit_req, gilt für alle
#      Gunicorn-Worker gemeinsam).
#   5. Upload-Größe und Wartezeiten begrenzen (Schutz vor Slowloris & Riesen-Uploads).
#   6. gzip-Komprimierung für Text-Antworten (CSS, JS, JSON, SVG).
#
# Zertifikat: nginx/certs/fullchain.pem + privkey.pem
#   * lokal/Intranet: scripts/generate_dev_cert.sh (selbstsigniert, macht setup.sh)
#   * echte Domain:   Zertifikat z. B. von Let's Encrypt dort ablegen (gleiche Namen).
# =============================================================================

# Rate-Limit-Zone: pro Client-IP 20 Anfragen/Minute auf Auth-Endpunkte.
# 10 MB Speicher reichen für ~160.000 IP-Adressen.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_status 429;

upstream bellmann_web {
    server web:5000;
    # Offene Verbindungen zu Gunicorn wiederverwenden (spart TCP-Handshakes).
    keepalive 16;
}

# ------------------------------------------------------------------ HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;

    # 301 = dauerhaft umgezogen. $host enthält nur den Hostnamen (ohne Port), daher
    # wird der öffentliche HTTPS-Port aus der Compose-Konfiguration angehängt.
    location / {
        return 301 https://$host:${NGINX_HTTPS_PORT}$request_uri;
    }
}

# ------------------------------------------------------------------ HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Nginx-Version nicht in Fehlerseiten/Headern verraten.
    server_tokens off;

    # --- TLS ----------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # Nur moderne Protokolle (TLS 1.0/1.1 gelten als unsicher).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # bei TLS 1.3 wählt der Client die beste Cipher
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Größen & Timeouts --------------------------------------------------------
    client_max_body_size 2m;        # passt zu MAX_CONTENT_LENGTH der App (CSV-Import)
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # --- Sicherheits-Header --------------------------------------------------------
    # CSP, X-Frame-Options, HSTS & Co. setzt die App selbst (app/utils/security_headers.py),
    # damit sie hinter nginx (lokal) und Traefik (Server) identisch sind.

    # --- Komprimierung -------------------------------------------------------------
    # gzip spart bei CSS/JS/JSON ca. 70–80 % Übertragung. gzip_proxied any: auch die
    # Antworten von Gunicorn (hinter dem Proxy) komprimieren. Vary: Accept-Encoding
    # sagt Zwischenspeichern, dass es zwei Varianten gibt.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # Die Cache-Header für /static/ (1 Jahr "immutable" bei ?v=<hash>) setzt die App
    # selbst (app/utils/assets.py) – Nginx reicht sie unverändert durch.

    # --- Proxy-Einstellungen (gelten für alle location-Blöcke) ----------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host enthält Host UND Port (z. B. localhost:8443) -> korrekte Redirects in Flask.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # Authelia-Header vom Client verwerfen (leerer Wert = Nginx sendet sie nicht weiter).
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name "";
    proxy_set_header Remote-Email "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # Etwas länger als der Gunicorn-Timeout (60 s), damit Gunicorn zuerst abbricht.
    proxy_read_timeout 65s;

    # --- Brute-Force-Schutz ---------------------------------------------------------
    # burst: kurze Spitzen (z. B. viele Kollegen hinter derselben Büro-IP um 8 Uhr)
    # werden ohne Verzögerung durchgelassen, danach greift das Limit.
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://bellmann_web;
    }

    location ~ ^/api/v1/auth/(forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://bellmann_web;
    }

    # --- Alles andere ----------------------------------------------------------------
    location / {
        proxy_pass http://bellmann_web;
    }
}
