# =============================================================================
# CI/CD-Pipeline (GitHub Actions)
# -----------------------------------------------------------------------------
#   lint ──> test ──> build ──> (nur main/Tags) push nach GHCR
#
# Läuft bei jedem Push und Pull Request. Ein Job startet erst, wenn der vorherige
# grün ist ("needs"). So landet nur geprüfter Code als Image in der Registry.
# Image-Adresse: ghcr.io/<owner>/<repo>:<tag>
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab (spart Minuten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimalrechte; der Push-Job erweitert sie gezielt.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.16.8 black==26.5.1
      - run: ruff check .
      - run: black --check .

  test:
    name: Tests (pytest + PostgreSQL)
    needs: lint
    runs-on: ubuntu-latest
    services:
      # Echte PostgreSQL wie in Produktion (timestamptz, make_interval ...).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bellmann_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bellmann_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Die Tests bauen das Schema über alle Alembic-Migrationen auf -> prüft sie mit.
      - run: pytest --cov --cov-report=term --cov-fail-under=70

  build:
    name: Docker-Image bauen (und pushen)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig für den Push nach ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen (und bei Push auf main/Tag veröffentlichen)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
