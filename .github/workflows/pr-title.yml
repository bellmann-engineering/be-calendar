# =============================================================================
# Prüft, ob der Titel eines Pull Requests den Conventional Commits entspricht,
# z. B. "feat: CSV-Import mit Einladungs-Mail" oder "fix(events): Kollisionsprüfung".
# Erlaubte Typen: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
# Vorteil: Aus der Historie lassen sich später automatisch Changelogs/Versionen erzeugen.
# =============================================================================
name: PR-Titel

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
